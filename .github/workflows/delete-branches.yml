name: Delete branches

# Started by hand: deletes the listed branches (separated by spaces); main is never deleted
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Branch names, separated by spaces
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          for b in $BRANCHES; do
            if [ "$b" = main ]; then echo "Skipping main"; continue; fi
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "Deleted $b"
          done
