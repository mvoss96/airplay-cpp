name: Interop

# Also called by projects that use the library, e.g. the ESPHome component, to test the version they pin
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit of the library to test
        type: string
        required: true

jobs:
  interop:
    # Independent senders stream a test signal to the POSIX example: every sample must arrive in order and
    # playback must lock to the sender's clock. pyatv (Python, unencrypted, retransmits lost packets) and
    # PipeWire's RAOP sink (C, RSA/AES encrypted ALAC, does not retransmit). The lossy runs drop, reorder and
    # duplicate 5/2/1 % of the UDP packets the receiver gets. The password run makes pyatv log in with RTSP
    # Digest authentication. The airplay2 runs make pyatv use AirPlay 2 (transient pairing, encrypted RTSP and
    # ChaCha20-Poly1305 audio), one of them in the order iOS uses, one after a HomeKit pairing as the Home app makes it. The buffered runs send AirPlay 2 buffered audio
    # (AAC over TCP, as iOS streams most apps; ALAC in the alac runs, as Music Assistant sends it and pauses it) and compare the
    # output with ffmpeg's decoding. pyatv is deliberately unpinned; srptools 2 changed an API pyatv 0.18 uses.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sender: [pyatv, pipewire]
        network: [clean, lossy]
        include:
          - sender: pyatv
            network: password
          - sender: pyatv
            network: airplay2
          - sender: pyatv
            network: airplay2-lossy
          - sender: pyatv
            network: airplay2-record-first
          - sender: pyatv
            network: airplay2-stream-key
          - sender: pyatv
            network: airplay2-homekit
          - sender: buffered
            network: clean
          - sender: buffered
            network: pause
          - sender: buffered
            network: second-session
          - sender: buffered
            network: handover
          - sender: buffered
            network: takeover
          - sender: buffered
            network: alac
          - sender: buffered
            network: alac-resume
          - sender: buffered
            network: alac-pause
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mvoss96/airplay-cpp
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libmbedtls-dev
          if [ "${{ matrix.sender }}" = pyatv ]; then
            pip install pyatv "srptools<2"
          elif [ "${{ matrix.sender }}" = buffered ]; then
            # AAC: ffmpeg encodes the test file and decodes the reference, FAAD2 decodes in the receiver
            sudo apt-get install -y ffmpeg libfaad-dev
            pip install pyatv "srptools<2" numpy
          else
            sudo apt-get install -y pipewire pipewire-bin wireplumber dbus-daemon
          fi
      - name: Build receiver
        run: |
          cmake -S . -B build -DAIRPLAY_BUILD_EXAMPLES=ON
          cmake --build build -j
          gcc -shared -fPIC -O2 -Wall -Wextra tests/interop/impair.c -o build/impair.so -ldl
      - name: Stream
        run: |
          case "${{ matrix.network }}" in
            airplay2*) export AIRPLAY2=1 ;;
          esac
          case "${{ matrix.network }}" in
            # As iOS sends it: RECORD before the stream SETUP, which has no key but uses that of a buffered
            # stream offered before
            *record-first) export RECORD_FIRST=1 AUDIO_KEY=earlier AIRPLAY_TEST_SENDER_VOLUME=0.4 ;;
            # As iOS 26 sends a realtime stream it starts a session with: a key derived from the pairing
            *stream-key) export RECORD_FIRST=1 AUDIO_KEY=stream AIRPLAY_DEVICE_VOLUME=0.6 ;;
            # As the Home app adds the receiver: a HomeKit pairing with the fixed PIN, then pair-verify
            *homekit) export HOMEKIT=1 ;;
          esac
          case "${{ matrix.network }}" in
            *lossy) export IMPAIR_SO=build/impair.so IMPAIR_LOSS=0.05 IMPAIR_REORDER=0.02 IMPAIR_DUPLICATE=0.01 ;;
          esac
          case "${{ matrix.network }}" in
            pause) export PAUSE=1 REMOTE_CONTROL=1 ;;
            second-session) export SECOND_SESSION=1 ;;
            handover) export HANDOVER=1 ;;
            takeover) export TAKEOVER=1 ;;
            alac) export ALAC=1 ;;
            alac-resume) export ALAC=1 MA_RESUME=1 ;;
            alac-pause) export ALAC=1 MA_PAUSE=1 ;;
          esac
          if [ "${{ matrix.network }}" = password ]; then
            export PASSWORD=airplay-test
          fi
          tests/interop/run.sh posix build/airplay_receiver ${{ matrix.sender }}
