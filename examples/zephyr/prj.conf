CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_AIRPLAY_CPP=y

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_OPEN_MAX=16
# The receiver polls the open ones of its sockets at once: 3 UDP, the listener and up to 6 connections
CONFIG_ZVFS_POLL_MAX=10

CONFIG_MAIN_STACK_SIZE=16384
# Jitter buffer (2.5 s, about 460 KB) and decoder, allocated with k_malloc
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# mbedTLS with RSA (PKCS#1 v1.5 and OAEP), PEM keys, AES-CBC and SHA-1
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_MD=y
CONFIG_ENTROPY_GENERATOR=y
