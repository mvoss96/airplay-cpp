# PipeWire's RAOP sink streaming to a receiver on 127.0.0.1:5000 with RSA encryption
context.modules = [
  { name = libpipewire-module-raop-sink
    args = {
      raop.ip = "127.0.0.1"
      raop.port = 5000
      raop.name = "Interop"
      raop.hostname = "localhost"
      raop.transport = "udp"
      raop.encryption.type = "RSA"
      raop.audio.codec = "PCM"
      stream.props = { node.name = "raop_sink" media.class = "Audio/Sink" }
    }
  }
]
