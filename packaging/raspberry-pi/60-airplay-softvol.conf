# Software volume for the Raspberry Pi headphone jack, written by the
# airplay-cpp installer. The sender's volume then controls the analog output,
# with -30 dB as the quietest step instead of digital silence.
#
# For HDMI or a USB sound card the installer picks a plain plug device instead;
# this file is then not installed.
pcm.airplay {
    type softvol
    slave.pcm "hw:CARD=Headphones,DEV=0"
    control {
        name "AirPlay"
        card 0
    }
    min_dB -30.0
    max_dB 0.0
    resolution 100
}
